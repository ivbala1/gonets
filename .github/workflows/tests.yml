name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,voice]'
      - run: python -m pytest -q
      - run: python -m pytest -q
        env:
          CLAUDE_TG_BOT_TEST_LANG: en
      - run: python tools/i18n_catalog.py check
