[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-tg-bot"
version = "0.2.0"
description = "Gonets: Telegram bridge to Claude Code with approval cards"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[ext]>=21.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.10",
    "httpx>=0.28",
    "telethon>=1.44",
]

[project.optional-dependencies]
voice = ["openai>=1.50"]
dev = ["pytest>=8"]

[project.scripts]
claude-tg-bot = "claude_tg_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_tg_bot = ["locales/*.json", "skills/news_digest/*.json", "skills/news_digest/*.md"]
